<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL to QR Code Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .qr-box {
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            border: 1px solid #ddd;
            padding: 5px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>QR Code Generator</h2>
        <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://example.com)">
        <button onclick="generateQR()">Generate QR Code</button>
        
        <div class="qr-box">
            <img id="qrImage" src="" alt="QR Code">
        </div>
    </div>

    <script>
        function generateQR() {
            const urlInput = document.getElementById("urlInput").value.trim();
            const qrImage = document.getElementById("qrImage");

            if (urlInput === "") {
                alert("Please enter a valid URL");
                qrImage.style.display = "none";
                return;
            }

            // Using a free QR code API service
            const qrApiUrl = `https://qrserver.com{encodeURIComponent(urlInput)}`;
            
            qrImage.src = qrApiUrl;
            qrImage.style.display = "block";
        }
    </script>

</body>
</html>
